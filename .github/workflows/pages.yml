# Builds the site and publishes it to GitHub Pages on every push to main.
# Pull requests only run the build (a check that the site still builds); they never deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      # Actions are pinned to full commit SHAs (a moved tag cannot swap in other code).
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run build
      # GitHub Pages has no PHP; the FTP-hosting files are not needed there
      - run: rm -f dist/send.php dist/.htaccess
      # Safety net: fail the build if a known indicator of the old site's malware shows up
      - name: Scan build for malware indicators
        run: |
          if grep -rIniE 'eval\(|atob\(|document\.write|String\.fromCharCode|\bweb3\b|\bethers\b|\bpako\b|0x9179dda8|bsc-dataseed|publicnode' dist; then
            echo "::error::Suspicious code found in dist/ (see public/CLAUDE.md, section on security)"; exit 1
          fi
          if find dist -iname '*.php' | grep -q .; then echo "::error::PHP file in dist/"; exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
